name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: Specter099/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    with:
      python-versions: '["3.11","3.12"]'
      # setuptools: the runner's 79.0.1 has advisories fixed in 83.0.0 and 84.1.0.
      install-command: "pip install --upgrade -e .[dev] setuptools>=84.1.0"
      lint-paths: "src tests"
      coverage: true
      coverage-threshold: 80
      pip-audit: true
      pip-audit-args: "--ignore-vuln CVE-2026-3219"
