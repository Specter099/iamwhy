name: Stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"

permissions: {}

jobs:
  stale:
    uses: Specter099/.github/.github/workflows/stale.yml@main
    permissions:
      issues: write
      pull-requests: write
    with:
      days-before-issue-stale: 60
      days-before-pr-stale: 60
      days-before-close: 7
      exempt-labels: "p1-critical,p2-important"
